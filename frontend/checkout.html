<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Konfirmasi | LaperCuy DelQueue</title>
  <link rel="stylesheet" href="/delqueue.css">
</head>
<body>
  <main class="container cart-layout">
    <section class="panel">
      <h1>Konfirmasi Pesanan</h1>
      <p class="muted">Kode baru masuk antrean setelah tombol ini ditekan.</p>
      <div id="cart" class="grid"></div>
    </section>
    <aside class="panel">
      <h2>Pembayaran</h2>
      <p>Bayar di kantin saat mengambil pesanan.</p>
      <div class="split"><strong>Total</strong><strong id="subtotal">Rp 0</strong></div>
      <button id="confirm-order" class="btn primary" type="button">Masukkan ke Antrean</button>
      <div id="confirm-msg" class="toast"></div>
    </aside>
  </main>
  <script src="/delqueue.js"></script>
  <script>initCheckout();</script>
</body>
</html>
