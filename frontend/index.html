<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LaperCuy DelQueue</title>
  <link rel="stylesheet" href="/delqueue.css">
</head>
<body>
  <main class="container hero">
    <section class="hero-copy">
      <h1>LaperCuy DelQueue</h1>
      <p>Tekan tombol fisik di terminal kantin, ambil kode sementara, lalu pesan makanan dari sini tanpa akun siswa.</p>
      <p id="queue-summary" class="muted">Memuat status antrean...</p>
    </section>
    <section class="panel">
      <h2>Masukkan Kode Terminal</h2>
      <p class="muted">Format ABC-123. Kode bisa dipakai ulang sampai pesanan diambil.</p>
      <form id="claim-form" class="grid">
        <input id="code" class="code-input" inputmode="text" maxlength="7" placeholder="ABC-123" autocomplete="one-time-code" required>
        <button class="btn primary" type="submit">Buka Menu</button>
      </form>
      <div id="message" class="toast"></div>
      <p><a href="/dapur/login.html">Masuk dashboard dapur</a></p>
    </section>
  </main>
  <script src="/delqueue.js"></script>
  <script>initHome();</script>
</body>
</html>
