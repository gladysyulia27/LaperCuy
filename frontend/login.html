<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LaperCuy — Login</title>
    <meta name="description" content="Masuk ke akun LaperCuy Anda untuk memesan makanan favorit dengan mudah dan cepat.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
       
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden; /* Mutlak mencegah scroll pada body desktop */
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100dvh;
            background: linear-gradient(135deg, #1a0a08 0%, #4a1108 40%, #841006 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* Decorative blobs */
        .blob {
            position: absolute;
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }
        .blob-1 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(255, 100, 50, 0.12) 0%, transparent 70%);
            top: -100px; right: -50px;
        }
        .blob-2 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(255, 200, 50, 0.08) 0%, transparent 70%);
            bottom: -50px; left: -50px;
        }

        /* ── Kartu Auth ── */
        .auth-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 30px 40px; 
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
            animation: cardEntrance 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
            
            /* Agar tetap aman jika layar pendek, namun diatur agar tidak scroll jika muat */
            max-height: 98vh; 
            overflow-y: auto; 
        }
        
        /* Hilangkan scrollbar visual untuk kebersihan desain */
        .auth-card::-webkit-scrollbar { width: 0; background: transparent; }

        @keyframes cardEntrance {
            from { opacity: 0; transform: scale(0.96) translateY(15px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .auth-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 12px;
        }

        .auth-logo img {
            height: 210px;
            width: auto;
            max-width: 100%;
            object-fit: contain;
        }

        .auth-title {
            font-size: 24px;
            font-weight: 800;
            color: #1a0a08;
            margin-bottom: 4px;
            text-align: center;
        }

        .auth-subtitle {
            font-size: 13px;
            color: #777;
            text-align: center;
            margin-bottom: 20px;
        }

        /* ── Form Inputs ── */
        .form-group { margin-bottom: 14px; }

        .form-group label {
            display: block;
            font-size: 10.5px;
            font-weight: 700;
            color: #555;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .form-group input {
            width: 100%;
            border: 1.5px solid #eee;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            font-family: inherit;
            background: #F9F9F9;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #841006;
            background: white;
            box-shadow: 0 0 0 4px rgba(132, 16, 6, 0.08);
        }

        .form-group input.error { border-color: #E53935; background: #FFF5F5; }
        .input-error-msg { font-size: 10px; color: #E53935; margin-top: 3px; display: none; }
        .input-error-msg.visible { display: block; }

        /* ── Button ── */
        .btn-auth {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #841006 0%, #C0392B 100%);
            color: white;
            font-size: 14px; font-weight: 700;
            border: none; border-radius: 12px;
            cursor: pointer; margin-top: 5px;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(132, 16, 6, 0.25);
        }

        .btn-auth:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(132, 16, 6, 0.35);
        }

        .auth-divider {
            text-align: center; font-size: 11px; color: #BBB;
            margin: 18px 0; position: relative;
        }
        .auth-divider::before, .auth-divider::after {
            content: ''; position: absolute; top: 50%;
            width: calc(50% - 20px); height: 1px; background: #EEE;
        }
        .auth-divider::before { left: 0; }
        .auth-divider::after { right: 0; }

        .auth-link-row { text-align: center; font-size: 13px; color: #666; }
        .auth-link-row a { color: #841006; font-weight: 700; text-decoration: none; }

        .alert-error {
            background: #FFF0F0; border: 1px solid #FFCDD2; border-radius: 10px;
            padding: 10px; font-size: 12px; color: #C62828;
            margin-bottom: 12px; display: none; gap: 8px; align-items: center;
        }
        .alert-error.visible { display: flex; }

        .loading-spinner {
            width: 16px; height: 16px; border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white; border-radius: 50%;
            animation: spin 0.8s linear infinite; display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── RESPONSIVE MOBILE ── */
        @media (max-width: 480px) {
            body { padding: 15px; }
            .auth-card {
                padding: 25px 20px;
                border-radius: 28px;
                max-height: 98dvh;
                overflow-y: auto; 
            }
            .auth-logo img { height: 140px; } /* Di HP logo otomatis mengecil agar muat */
            .auth-title { font-size: 21px; }
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="auth-card">
        <div class="auth-logo">
            <img src="assets/logomaroon.png" alt="LaperCuy Logo">
        </div>

        <h1 class="auth-title">Selamat Datang! 👋</h1>
        <p class="auth-subtitle">Masuk ke akun LaperCuy Anda</p>

        <div class="alert-error" id="alert-error">
            <span>⚠️</span>
            <span id="alert-error-msg">Email atau password salah.</span>
        </div>

        <form id="login-form" novalidate>
            <div class="form-group">
                <label for="login-email">Alamat Email</label>
                <input type="email" id="login-email" placeholder="email@kamu.com" autocomplete="email" required>
                <span class="input-error-msg" id="err-email">Masukkan email yang valid.</span>
            </div>

            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required>
                <span class="input-error-msg" id="err-password">Password tidak boleh kosong.</span>
            </div>

            <button type="submit" class="btn-auth" id="btn-login">
                <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                    <div class="loading-spinner" id="login-spinner"></div>
                    <span id="login-btn-text">Masuk Sekarang</span>
                </div>
            </button>
        </form>

        <div class="auth-divider">atau</div>
        <div class="auth-link-row"> Belum punya akun? <a href="register.html">Daftar Sekarang</a></div>
    </div>

    <script>
        const API_BASE = '/api';

        const token = localStorage.getItem('lc_token');
        if (token) window.location.href = 'index.html';

        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('login-email');
        const passInput = document.getElementById('login-password');
        const btnLogin = document.getElementById('btn-login');
        const spinner = document.getElementById('login-spinner');
        const btnText = document.getElementById('login-btn-text');
        const alertErr = document.getElementById('alert-error');
        const alertErrMsg = document.getElementById('alert-error-msg');

        const showError = (msg) => {
            alertErrMsg.textContent = msg;
            alertErr.classList.add('visible');
        };

        const hideError = () => alertErr.classList.remove('visible');

        const setLoading = (loading) => {
            btnLogin.disabled = loading;
            spinner.style.display = loading ? 'block' : 'none';
            btnText.textContent = loading ? 'Sedang Masuk...' : 'Masuk Sekarang';
        };

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const email = emailInput.value.trim();
            const password = passInput.value;

            let valid = true;
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                document.getElementById('err-email').classList.add('visible');
                emailInput.classList.add('error');
                valid = false;
            } else {
                document.getElementById('err-email').classList.remove('visible');
                emailInput.classList.remove('error');
            }

            if (!password) {
                document.getElementById('err-password').classList.add('visible');
                passInput.classList.add('error');
                valid = false;
            } else {
                document.getElementById('err-password').classList.remove('visible');
                passInput.classList.remove('error');
            }

            if (!valid) return;

            setLoading(true);

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    showError(data.message || 'Login gagal. Coba lagi.');
                    return;
                }

                localStorage.setItem('lc_token', data.token);
                localStorage.setItem('lc_user', JSON.stringify(data.user));
                window.location.href = 'index.html';

            } catch (err) {
                console.error(err);
                showError('Tidak dapat terhubung ke server.');
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
