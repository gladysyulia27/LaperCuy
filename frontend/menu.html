<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu | LaperCuy DelQueue</title>
  <link rel="stylesheet" href="/delqueue.css">
</head>
<body>
  <main class="container cart-layout">
    <section>
      <div class="toolbar">
        <div>
          <h1>Menu Kantin</h1>
          <p class="muted">Stok dan estimasi berasal dari dapur.</p>
        </div>
        <input id="search" class="search" placeholder="Cari makanan">
      </div>
      <div class="chips">
        <button class="chip active" data-cat="all">Semua</button>
        <button class="chip" data-cat="nasi">Nasi</button>
        <button class="chip" data-cat="mie">Mie</button>
        <button class="chip" data-cat="snack">Snack</button>
        <button class="chip" data-cat="sweets">Sweets</button>
        <button class="chip" data-cat="minuman">Minuman</button>
      </div>
      <div id="foods" class="grid menu" style="margin-top:18px"></div>
    </section>
    <aside class="panel">
      <h2>Keranjang</h2>
      <div id="cart" class="grid"></div>
      <hr>
      <div class="split"><strong>Subtotal</strong><strong id="subtotal">Rp 0</strong></div>
      <p class="muted">Bayar di kantin saat mengambil pesanan.</p>
      <a id="checkout-link" class="btn primary" href="/checkout.html">Konfirmasi Pesanan</a>
    </aside>
  </main>
  <script src="/delqueue.js"></script>
  <script>initMenu();</script>
</body>
</html>
