<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LaperCuy — Daftar Akun Baru</title>
    <meta name="description" content="Buat akun LaperCuy gratis dan mulai pesan makanan favoritmu hari ini.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ── Reset & Dasar ── */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden; /* Mencegah scroll pada body desktop */
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100dvh;
            background: linear-gradient(135deg, #1a0a08 0%, #4a1108 40%, #841006 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            position: relative;
        }

        /* Blobs Dekoratif */
        .blob {
            position: absolute;
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }
        .blob-1 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(255, 100, 50, 0.12) 0%, transparent 70%);
            top: -100px; right: -50px;
        }
        .blob-2 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(255, 200, 50, 0.08) 0%, transparent 70%);
            bottom: -50px; left: -50px;
        }

        /* ── Kartu Auth ── */
        .auth-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 25px 40px; 
            width: 100%;
            max-width: 540px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
            animation: cardEntrance 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
            
            /* Agar tetap aman jika layar pendek */
            max-height: 98vh;
            overflow-y: auto;
        }

        /* Hilangkan scrollbar visual */
        .auth-card::-webkit-scrollbar { width: 0; background: transparent; }

        @keyframes cardEntrance {
            from { opacity: 0; transform: scale(0.96) translateY(15px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .auth-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 8px;
        }
        .auth-logo img {
            height: 210px; 
            width: auto;
            max-width: 100%;
            object-fit: contain;
        }

        .auth-title {
            font-size: 22px;
            font-weight: 800;
            color: #1a0a08;
            margin-bottom: 4px;
            text-align: center;
        }

        .auth-subtitle {
            font-size: 13px;
            color: #777;
            text-align: center;
            margin-bottom: 15px;
        }

        /* ── Grid Form ── */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group { display: flex; flex-direction: column; }
        .form-group.full { grid-column: span 2; }

        .form-group label {
            font-size: 10px;
            font-weight: 700;
            color: #555;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        .form-group input, .form-group select {
            width: 100%;
            border: 1.5px solid #eee;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 13px;
            font-family: inherit;
            background: #F9F9F9;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #841006;
            background: white;
            box-shadow: 0 0 0 4px rgba(132, 16, 6, 0.08);
        }

        .form-group input.error { border-color: #E53935; background: #FFF5F5; }
        .input-error-msg { font-size: 10px; color: #E53935; margin-top: 3px; display: none; }
        .input-error-msg.visible { display: block; }

        /* Password Strength */
        .password-strength { height: 3px; border-radius: 2px; margin-top: 6px; background: #eee; overflow: hidden; }
        .password-strength-bar { height: 100%; width: 0%; transition: all 0.3s ease; }

        /* ── Button ── */
        .btn-auth {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #841006 0%, #C0392B 100%);
            color: white;
            font-size: 14px; font-weight: 700;
            border: none; border-radius: 12px;
            cursor: pointer; margin-top: 10px;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(132, 16, 6, 0.25);
        }

        .btn-auth:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(132, 16, 6, 0.35); }

        .auth-divider { text-align: center; font-size: 11px; color: #BBB; margin: 15px 0; position: relative; }
        .auth-divider::before, .auth-divider::after {
            content: ''; position: absolute; top: 50%; width: calc(50% - 20px); height: 1px; background: #EEE;
        }
        .auth-divider::before { left: 0; } .auth-divider::after { right: 0; }

        .auth-link-row { text-align: center; font-size: 13px; color: #666; }
        .auth-link-row a { color: #841006; font-weight: 700; text-decoration: none; }

        .alert-error {
            background: #FFF0F0; border: 1px solid #FFCDD2; border-radius: 10px;
            padding: 10px; font-size: 12px; color: #C62828; margin-bottom: 12px; display: none; gap: 8px; align-items: center;
        }
        .alert-error.visible { display: flex; }

        .loading-spinner {
            width: 16px; height: 16px; border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── RESPONSIVE MOBILE ── */
        @media (max-width: 600px) {
            .auth-card { padding: 25px 20px; border-radius: 28px; max-height: 98dvh; }
            .form-grid { grid-template-columns: 1fr; gap: 10px; }
            .form-group.full, .form-group { grid-column: span 1; }
            .auth-logo img { height: 140px; } /* Mengecil di mobile agar muat */
            .auth-title { font-size: 20px; }
        }
    </style>
</head>

<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="auth-card">
        <div class="auth-logo">
            <img src="assets/logomaroon.png" alt="LaperCuy Logo">
        </div>

        <h1 class="auth-title">Buat Akun Baru 🎉</h1>
        <p class="auth-subtitle">Bergabung dan nikmati kemudahan pesan makan</p>

        <div class="alert-error" id="alert-error">
            <span>⚠️</span>
            <span id="alert-error-msg">Terjadi kesalahan.</span>
        </div>

        <form id="register-form" novalidate>
            <div class="form-grid">
                <div class="form-group full">
                    <label for="reg-fullname">Nama Lengkap</label>
                    <input type="text" id="reg-fullname" placeholder="Niken Sitohang" required>
                    <span class="input-error-msg" id="err-fullname">Nama tidak boleh kosong.</span>
                </div>

                <div class="form-group">
                    <label for="reg-username">Username</label>
                    <input type="text" id="reg-username" placeholder="nikensthg" required>
                    <span class="input-error-msg" id="err-username">Username minimal 3 karakter.</span>
                </div>

                <div class="form-group">
                    <label for="reg-phone">No. HP</label>
                    <input type="text" id="reg-phone" placeholder="0823xxx">
                </div>

                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" placeholder="email@kamu.com" required>
                    <span class="input-error-msg" id="err-email">Format email salah.</span>
                </div>

                <div class="form-group">
                    <label for="reg-gender">Gender</label>
                    <select id="reg-gender">
                        <option value="">Pilih</option>
                        <option value="Wanita">Wanita</option>
                        <option value="Pria">Pria</option>
                    </select>
                </div>

                <div class="form-group full">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" placeholder="Min. 6 karakter" required>
                    <div class="password-strength"><div class="password-strength-bar" id="pwd-strength-bar"></div></div>
                    <span class="input-error-msg" id="err-password">Minimal 6 karakter.</span>
                </div>
            </div>

            <button type="submit" class="btn-auth" id="btn-register">
                <div style="display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <div class="loading-spinner" id="reg-spinner"></div>
                    <span id="reg-btn-text">Daftar Sekarang</span>
                </div>
            </button>
        </form>

        <div class="auth-divider">atau</div>
        <div class="auth-link-row">Sudah punya akun? <a href="login.html">Masuk</a></div>
    </div>

    <script>
        const API_BASE = '/api';
        const token = localStorage.getItem('lc_token');
        if (token) window.location.href = 'index.html';

        const pwdInput = document.getElementById('reg-password');
        const strengthBar = document.getElementById('pwd-strength-bar');

        pwdInput.addEventListener('input', () => {
            const val = pwdInput.value;
            let strength = 0;
            if (val.length >= 6) strength += 33;
            if (val.length >= 10) strength += 33;
            if (/[^a-zA-Z0-9]/.test(val) || /\d/.test(val)) strength += 34;
            strengthBar.style.width = strength + '%';
            strengthBar.style.background = strength <= 33 ? '#E53935' : strength <= 66 ? '#FB8C00' : '#43A047';
        });

        const form = document.getElementById('register-form');
        const spinner = document.getElementById('reg-spinner');
        const btnText = document.getElementById('reg-btn-text');
        const btnReg = document.getElementById('btn-register');
        const alertErr = document.getElementById('alert-error');
        const alertMsg = document.getElementById('alert-error-msg');

        const showError = (msg) => { alertMsg.textContent = msg; alertErr.classList.add('visible'); };
        const hideError = () => alertErr.classList.remove('visible');

        const setLoading = (loading) => {
            btnReg.disabled = loading;
            spinner.style.display = loading ? 'block' : 'none';
            btnText.textContent = loading ? 'Mendaftar...' : 'Daftar Sekarang';
        };

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            const fullname = document.getElementById('reg-fullname').value.trim();
            const username = document.getElementById('reg-username').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const gender = document.getElementById('reg-gender').value;
            const password = pwdInput.value;

            let valid = true;
            const validate = (id, errId, condition, msg) => {
                const el = document.getElementById(id);
                const errEl = document.getElementById(errId);
                if (!condition) { el.classList.add('error'); errEl.textContent = msg; errEl.classList.add('visible'); valid = false; }
                else { el.classList.remove('error'); errEl.classList.remove('visible'); }
            };

            validate('reg-fullname', 'err-fullname', fullname.length > 0, 'Wajib diisi.');
            validate('reg-username', 'err-username', username.length >= 3, 'Min. 3 karakter.');
            validate('reg-email', 'err-email', /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email), 'Format salah.');
            validate('reg-password', 'err-password', password.length >= 6, 'Min. 6 karakter.');

            if (!valid) return;
            setLoading(true);
            try {
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullname, username, email, phone, gender, password }),
                });
                const data = await response.json();
                if (!response.ok || !data.success) { showError(data.message || 'Gagal.'); return; }
                localStorage.setItem('lc_token', data.token);
                localStorage.setItem('lc_user', JSON.stringify(data.user));
                window.location.href = 'index.html';
            } catch (err) { showError('Server Error.'); } finally { setLoading(false); }
        });
    </script>
</body>
</html>
